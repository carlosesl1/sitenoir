name: Deploy Noir Digital to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - "noir-digital/**"
      - ".github/workflows/deploy-hostinger.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noir-digital-hostinger-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Validate and export
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://noirdigital.com.br
      NEXT_PUBLIC_CONTACT_ENDPOINT: https://noirdigital.com.br/wp-json/noir/v1/contact
    defaults:
      run:
        shell: bash
        working-directory: noir-digital
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: noir-digital/package-lock.json

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run WordPress contact tests
        run: php tests/wordpress/noir-contact-endpoint.test.php

      - name: Build static export
        run: npm run build

      - name: Verify export
        run: |
          test -f out/index.html
          test -f out/.htaccess
          test -f out/assets/v1/.htaccess
          test -d out/_next/static
          test -f out/wp-content/mu-plugins/noir-contact-endpoint.php
          grep -q "NOIR DIGITAL" out/index.html

      - name: Write deployment manifest
        run: |
          manifest_name="deploy-manifest-${GITHUB_SHA}.json"
          printf '{"sha":"%s","run_id":"%s","run_attempt":"%s"}\n' \
            "${GITHUB_SHA}" \
            "${GITHUB_RUN_ID}" \
            "${GITHUB_RUN_ATTEMPT}" \
            > "out/${manifest_name}"

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: noir-digital-static-${{ github.sha }}
          path: noir-digital/out
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  deploy_production:
    name: Deploy production with rollback
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://noirdigital.com.br
    env:
      FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
      FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
      FTP_PORT: ${{ vars.HOSTINGER_FTP_PORT }}
      # This FTP account is chrooted directly into Hostinger's public_html.
      FTP_TARGET: .
      PRODUCTION_URL: https://noirdigital.com.br
    steps:
      - name: Download export artifact
        uses: actions/download-artifact@v4
        with:
          name: noir-digital-static-${{ github.sha }}
          path: out

      - name: Validate production target
        run: |
          : "${FTP_HOST:?Configure o secret HOSTINGER_FTP_HOST.}"
          : "${FTP_USER:?Configure o secret HOSTINGER_FTP_USER.}"
          : "${FTP_PASSWORD:?Configure o secret HOSTINGER_FTP_PASSWORD.}"

          FTP_PORT="${FTP_PORT:-21}"

          [[ "${FTP_PORT}" =~ ^[0-9]{1,5}$ ]]
          [[ "${FTP_TARGET}" == "." ]]
          [[ "${PRODUCTION_URL}" == "https://noirdigital.com.br" ]]

          echo "FTP_PORT=${FTP_PORT}" >>"${GITHUB_ENV}"

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Configure FTP credentials
        run: |
          umask 077
          {
            printf 'machine %s\n' "${FTP_HOST}"
            printf 'login %s\n' "${FTP_USER}"
            printf 'password %s\n' "${FTP_PASSWORD}"
          } >"${HOME}/.netrc"
          {
            echo 'set net:max-retries 6'
            echo 'set net:timeout 30'
            echo 'set net:reconnect-interval-base 5'
            echo 'set net:reconnect-interval-max 30'
            echo 'set ftp:passive-mode true'
          } >"${HOME}/.lftprc"

      - name: Back up current entry files
        id: backup
        run: |
          local_backup="${RUNNER_TEMP}/hostinger-backup"
          remote_backup="${FTP_TARGET}/.noir-rollback/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${local_backup}"

          lftp -e "
            set cmd:fail-exit yes;
            set net:max-retries 6;
            set net:timeout 30;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            open -p ${FTP_PORT} ${FTP_HOST};
            get ${FTP_TARGET}/.htaccess -o ${local_backup}/.htaccess;
            bye;
          "

          if lftp -e "
            set cmd:fail-exit yes;
            set net:max-retries 6;
            set net:timeout 30;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            open -p ${FTP_PORT} ${FTP_HOST};
            get ${FTP_TARGET}/index.html -o ${local_backup}/index.html;
            bye;
          "; then
            had_index_html=1
          else
            had_index_html=0
          fi

          if lftp -e "
            set cmd:fail-exit yes;
            set net:max-retries 6;
            set net:timeout 30;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            open -p ${FTP_PORT} ${FTP_HOST};
            get ${FTP_TARGET}/wp-content/mu-plugins/noir-contact-endpoint.php -o ${local_backup}/noir-contact-endpoint.php;
            bye;
          "; then
            had_mu_plugin=1
          else
            had_mu_plugin=0
          fi

          printf '%s\n' "${had_index_html}" >"${local_backup}/had-index-html"
          printf '%s\n' "${had_mu_plugin}" >"${local_backup}/had-mu-plugin"

          lftp -e "
            set cmd:fail-exit yes;
            set net:max-retries 6;
            set net:timeout 30;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            open -p ${FTP_PORT} ${FTP_HOST};
            mkdir -p ${remote_backup};
            put ${local_backup}/.htaccess -o ${remote_backup}/.htaccess;
            put ${local_backup}/had-index-html -o ${remote_backup}/had-index-html;
            put ${local_backup}/had-mu-plugin -o ${remote_backup}/had-mu-plugin;
            bye;
          "

          if [[ "${had_index_html}" == "1" ]]; then
            lftp -e "
              set cmd:fail-exit yes;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate yes;
              open -p ${FTP_PORT} ${FTP_HOST};
              put ${local_backup}/index.html -o ${remote_backup}/index.html;
              bye;
            "
          fi

          if [[ "${had_mu_plugin}" == "1" ]]; then
            lftp -e "
              set cmd:fail-exit yes;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate yes;
              open -p ${FTP_PORT} ${FTP_HOST};
              mkdir -p ${remote_backup}/wp-content/mu-plugins;
              put ${local_backup}/noir-contact-endpoint.php -o ${remote_backup}/wp-content/mu-plugins/noir-contact-endpoint.php;
              bye;
            "
          fi

          {
            echo "LOCAL_BACKUP=${local_backup}"
            echo "REMOTE_BACKUP=${remote_backup}"
            echo "HAD_INDEX_HTML=${had_index_html}"
            echo "HAD_MU_PLUGIN=${had_mu_plugin}"
          } >>"${GITHUB_ENV}"

      - name: Deploy static export and mu-plugin
        id: publish
        run: |
          local_plugin="out/wp-content/mu-plugins/noir-contact-endpoint.php"
          downloaded_plugin="${RUNNER_TEMP}/noir-contact-endpoint.remote.php"

          if ! lftp -e "
            set cmd:fail-exit yes;
            set net:max-retries 6;
            set net:timeout 30;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            open -p ${FTP_PORT} ${FTP_HOST};
            cd ${FTP_TARGET}/wp-content/mu-plugins;
            bye;
          "; then
            lftp -e "
              set cmd:fail-exit yes;
              set net:max-retries 6;
              set net:timeout 30;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate yes;
              open -p ${FTP_PORT} ${FTP_HOST};
              mkdir ${FTP_TARGET}/wp-content/mu-plugins;
              bye;
            "
          fi

          lftp -e "
            set cmd:fail-exit yes;
            set net:max-retries 6;
            set net:timeout 30;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            open -p ${FTP_PORT} ${FTP_HOST};
            mirror --reverse --parallel=4 --verbose=1 \
              --exclude '^wp-admin(/|$)' \
              --exclude '^wp-content(/|$)' \
              --exclude '^wp-includes(/|$)' \
              --exclude '^wp-config\.php$' \
              --exclude '^wp-.*\.php$' \
              --exclude '^xmlrpc\.php$' \
              --exclude '^index\.php$' \
              --exclude '^index\.html$' \
              --exclude '^\.htaccess$' \
              out/ ${FTP_TARGET}/;
            put out/index.html -o ${FTP_TARGET}/index.html;
            put out/.htaccess -o ${FTP_TARGET}/.htaccess;
            cd ${FTP_TARGET}/wp-content/mu-plugins;
            put ${local_plugin} -o noir-contact-endpoint.php;
            get noir-contact-endpoint.php -o ${downloaded_plugin};
            bye;
          "

          LOCAL_PLUGIN_HASH="$(sha256sum "${local_plugin}" | awk '{print $1}')"
          REMOTE_PLUGIN_HASH="$(sha256sum "${downloaded_plugin}" | awk '{print $1}')"
          [[ "${LOCAL_PLUGIN_HASH}" == "${REMOTE_PLUGIN_HASH}" ]]
          echo "REMOTE_PLUGIN_HASH=${REMOTE_PLUGIN_HASH}" >>"${GITHUB_ENV}"

      - name: Verify exact production release
        run: |
          manifest_name="deploy-manifest-${GITHUB_SHA}.json"
          manifest_file="${RUNNER_TEMP}/${manifest_name}"
          response_file="${RUNNER_TEMP}/noir-production.html"

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            -H "Cache-Control: no-cache" \
            "${PRODUCTION_URL}/${manifest_name}" \
            --output "${manifest_file}"
          grep -q "\"sha\":\"${GITHUB_SHA}\"" "${manifest_file}"

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            -H "Cache-Control: no-cache" \
            "${PRODUCTION_URL}/?deploy=${GITHUB_SHA}" \
            --output "${response_file}"
          grep -q "NOIR DIGITAL" "${response_file}"

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            -H "Cache-Control: no-cache" \
            "${PRODUCTION_URL}/services/?deploy=${GITHUB_SHA}" \
            --output /dev/null

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            -H "Cache-Control: no-cache" \
            "${PRODUCTION_URL}/contato/?deploy=${GITHUB_SHA}" \
            --output /dev/null

          hero_model_path="$(grep -oE '/assets/v1/model/(hello|noir-adjusted)-[a-f0-9]{12}\.glb' out/index.html | head -n 1)"
          [[ -n "${hero_model_path}" ]]
          hero_headers="${RUNNER_TEMP}/noir-hero-model.headers"
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            -H "Cache-Control: no-cache" \
            -D "${hero_headers}" \
            "${PRODUCTION_URL}${hero_model_path}?deploy=${GITHUB_SHA}" \
            --output /dev/null
          tr -d '\r' <"${hero_headers}" | grep -qi '^content-type: model/gltf-binary$'
          tr -d '\r' <"${hero_headers}" | grep -qi '^cache-control: public, max-age=31536000, immutable$'

          captions_headers="${RUNNER_TEMP}/noir-captions.headers"
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            -H "Cache-Control: no-cache" \
            -D "${captions_headers}" \
            "${PRODUCTION_URL}/cases/strong/strong-whey-types.pt-BR.vtt?deploy=${GITHUB_SHA}" \
            --output /dev/null
          tr -d '\r' <"${captions_headers}" | grep -qi '^content-type: text/vtt'

          cors_headers="${RUNNER_TEMP}/noir-contact-cors.headers"
          curl --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            -X OPTIONS \
            -H "Origin: https://noirdigital.com.br" \
            -H "Access-Control-Request-Method: POST" \
            -D "${cors_headers}" \
            "${PRODUCTION_URL}/wp-json/noir/v1/contact" \
            --output /dev/null
          tr -d '\r' <"${cors_headers}" | grep -qi '^access-control-allow-origin: https://noirdigital.com.br$'

          validation_response="${RUNNER_TEMP}/noir-contact-validation.json"
          validation_status="$(curl --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            -H "Origin: https://noirdigital.com.br" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data '{"firstName":"","email":"invalid","service":"","message":"","website":""}' \
            --output "${validation_response}" \
            --write-out '%{http_code}' \
            "${PRODUCTION_URL}/wp-json/noir/v1/contact")"
          [[ "${validation_status}" == "400" ]]
          grep -q '"ok":false' "${validation_response}"
          grep -q 'Confira os campos informados.' "${validation_response}"

          blocked_status="$(curl --silent --show-error \
            --retry 2 \
            --retry-delay 2 \
            --max-time 30 \
            -H "Origin: https://attacker.example" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data '{"website":""}' \
            --output /dev/null \
            --write-out '%{http_code}' \
            "${PRODUCTION_URL}/wp-json/noir/v1/contact")"
          [[ "${blocked_status}" == "403" ]]

      - name: Roll back entry files after a failed publication
        if: failure() && steps.publish.outcome != 'skipped'
        run: |
          lftp -e "
            set cmd:fail-exit yes;
            set net:max-retries 6;
            set net:timeout 30;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            open -p ${FTP_PORT} ${FTP_HOST};
            put ${LOCAL_BACKUP}/.htaccess -o ${FTP_TARGET}/.htaccess;
            bye;
          "

          if [[ "${HAD_INDEX_HTML}" == "1" ]]; then
            lftp -e "
              set cmd:fail-exit yes;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate yes;
              open -p ${FTP_PORT} ${FTP_HOST};
              put ${LOCAL_BACKUP}/index.html -o ${FTP_TARGET}/index.html;
              bye;
            "
          else
            lftp -e "
              set cmd:fail-exit no;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate yes;
              open -p ${FTP_PORT} ${FTP_HOST};
              rm ${FTP_TARGET}/index.html;
              bye;
            " || true
          fi

          if [[ "${HAD_MU_PLUGIN}" == "1" ]]; then
            lftp -e "
              set cmd:fail-exit yes;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate yes;
              open -p ${FTP_PORT} ${FTP_HOST};
              cd ${FTP_TARGET}/wp-content/mu-plugins;
              put ${LOCAL_BACKUP}/noir-contact-endpoint.php -o noir-contact-endpoint.php;
              bye;
            "
          else
            lftp -e "
              set cmd:fail-exit no;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate yes;
              open -p ${FTP_PORT} ${FTP_HOST};
              rm ${FTP_TARGET}/wp-content/mu-plugins/noir-contact-endpoint.php;
              bye;
            " || true
          fi

          lftp -e "
            set cmd:fail-exit no;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            open -p ${FTP_PORT} ${FTP_HOST};
            rm ${FTP_TARGET}/deploy-manifest-${GITHUB_SHA}.json;
            bye;
          " || true

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            -H "Cache-Control: no-cache" \
            "${PRODUCTION_URL}/?rollback=${GITHUB_SHA}" \
            --output /dev/null

      - name: Remove local FTP credentials
        if: always()
        run: rm -f "${HOME}/.netrc" "${HOME}/.lftprc"
